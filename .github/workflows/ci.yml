name: CI

on: 
  push:
    branches:
      - main
      - develop
  pull_request: 
    branches:
      - main
      - develop
      
permissions:
  contents: read
  
concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  
jobs: 
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    
    defaults: 
      run: 
        working-directory: frontend
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run lint
        run: npm run lint
        
      - name: Build frontend
        run: npm run build
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env: 
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: cirmin.test
      Jwt__Audience: cirmin.test
      Jwt__SecretKey: ci-only-secret-key-with-at-least-32-characters
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: 9.0.x
          
      - name: Restore dependencies
        run: dotnet restore backend/CirMin.sln
        
      - name: Build backend
        run: dotnet build backend/CirMin.sln --configuration Release --no-restore
        
      - name: Test backend
        run: dotnet test backend/CirMin.sln --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"